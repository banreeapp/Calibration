<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_13 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_13" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_13');
  const devicePixelRatio = window.devicePixelRatio || 1;
  /**
 * Google Apps Script Backend for Medical Device Calibration Management System
 * Tech Stack: Google Sheets (DB), Google Drive (Storage), Telegram API
 */

// --- CONFIGURATION ---
const SPREADSHEET_ID = SpreadsheetApp.getActiveSpreadsheet().getId();
const FOLDER_ID = 'YOUR_GOOGLE_DRIVE_FOLDER_ID'; // Replace with your Drive Folder ID for Certificates

// --- CORE FUNCTIONS (GET/POST) ---

function doGet() {
  // Ensure system is setup before serving
  setupSystem();
  
  return HtmlService.createTemplateFromFile('Index')
    .evaluate()
    .setTitle('MediCal Systems - Calibration Management')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

/**
 * Include HTML partials into the main Index.html
 */
function include(filename) {
  return HtmlService.createHtmlOutputFromFile(filename).getContent();
}

// --- SYSTEM SETUP & INSTALLATION ---

/**
 * Automatically creates required sheets and headers if they don't exist
 */
function setupSystem() {
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  
  // 1. Setup 'Devices' Sheet
  let deviceSheet = ss.getSheetByName('Devices');
  if (!deviceSheet) {
    deviceSheet = ss.insertSheet('Devices');
    deviceSheet.appendRow([
      'device_id', 'device_name', 'model', 'serial_number', 'department', 
      'last_cal_date', 'next_cal_date', 'status', 'cert_file_id', 'qr_code_url'
    ]);
    deviceSheet.getRange(1, 1, 1, 10).setFontWeight('bold').setBackground('#E0F2F1');
  }

  // 2. Setup 'Users' Sheet
  let userSheet = ss.getSheetByName('Users');
  if (!userSheet) {
    userSheet = ss.insertSheet('Users');
    userSheet.appendRow(['email', 'full_name', 'role']);
    userSheet.getRange(1, 1, 1, 3).setFontWeight('bold').setBackground('#E3F2FD');
    
    // Add default admin (current user)
    const activeUser = Session.getActiveUser().getEmail();
    userSheet.appendRow([activeUser, 'System Administrator', 'Admin']);
  }

  // 3. Setup 'Settings' Sheet
  let settingsSheet = ss.getSheetByName('Settings');
  if (!settingsSheet) {
    settingsSheet = ss.insertSheet('Settings');
    settingsSheet.appendRow(['Key', 'Value', 'Description']);
    settingsSheet.getRange(1, 1, 1, 3).setFontWeight('bold').setBackground('#FFF3E0');
    
    // Add default settings
    settingsSheet.appendRows([
      ['telegram_bot_token', '', 'Token from BotFather'],
      ['telegram_chat_id', '', 'Telegram Group/Channel ID'],
      ['notification_days', '60', 'Days threshold for calibration alerts']
    ]);
  }
}

// --- DATABASE OPERATIONS ---

/**
 * Fetch summary data for Dashboard Cards
 */
function getDashboardStats() {
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  const sheet = ss.getSheetByName('Devices');
  const data = sheet.getDataRange().getValues();
  const headers = data.shift();
  
  let stats = {
    normal: 0,
    pending: 0,
    expired: 0,
    urgentTasks: []
  };

  const statusIdx = headers.indexOf('status');
  const nameIdx = headers.indexOf('device_name');
  const idIdx = headers.indexOf('device_id');
  const deptIdx = headers.indexOf('department');

  data.forEach(row => {
    const status = row[statusIdx];
    if (status === 'Normal') stats.normal++;
    else if (status === 'Pending') {
      stats.pending++;
      stats.urgentTasks.push({ id: row[idIdx], name: row[nameIdx], dept: row[deptIdx], status: 'Pending' });
    }
    else if (status === 'Expired') {
      stats.expired++;
      stats.urgentTasks.push({ id: row[idIdx], name: row[nameIdx], dept: row[deptIdx], status: 'Expired' });
    }
  });

  return stats;
}

/**
 * Save new device and upload PDF to Drive
 */
function saveDeviceData(formData, fileData) {
  try {
    const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
    const sheet = ss.getSheetByName('Devices');
    
    let fileUrl = '';
    let fileId = '';
    
    if (fileData) {
      const folder = DriveApp.getFolderById(FOLDER_ID);
      const blob = Utilities.newBlob(Utilities.base64Decode(fileData.base64), fileData.type, fileData.name);
      const file = folder.createFile(blob);
      fileUrl = file.getUrl();
      fileId = file.getId();
    }

    const qrUrl = `https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=${encodeURIComponent(formData.device_id)}`;

    sheet.appendRow([
      formData.device_id,
      formData.device_name,
      formData.model,
      formData.serial_number,
      formData.department,
      formData.last_cal_date,
      formData.next_cal_date,
      'Normal',
      fileId,
      qrUrl
    ]);

    return { success: true, message: 'Device registered successfully' };
  } catch (e) {
    return { success: false, message: e.toString() };
  }
}

// --- TELEGRAM NOTIFICATION LOGIC ---

function sendTelegramNotification(message) {
  const settings = getSystemSettings();
  const token = settings.telegram_bot_token;
  const chatId = settings.telegram_chat_id;
  
  if (!token || !chatId) return;

  const url = `https://api.telegram.org/bot\${token}/sendMessage`;
  const payload = {
    chat_id: chatId,
    text: message,
    parse_mode: 'HTML'
  };

  UrlFetchApp.fetch(url, {
    method: 'post',
    payload: payload
  });
}

/**
 * Daily check for expiring devices (Triggered by Time-based Trigger)
 */
function dailyCalibrationCheck() {
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  const sheet = ss.getSheetByName('Devices');
  const data = sheet.getDataRange().getValues();
  const headers = data.shift();
  
  const nextCalIdx = headers.indexOf('next_cal_date');
  const nameIdx = headers.indexOf('device_name');
  const today = new Date();
  const thresholdDays = getSystemSettings().notification_days || 60;
  
  let expiringDevices = [];

  data.forEach(row => {
    const nextCal = new Date(row[nextCalIdx]);
    const diffTime = nextCal - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays <= thresholdDays && diffDays > 0) {
      expiringDevices.push(`- \${row[nameIdx]} (Due in \${diffDays} days)`);
    } else if (diffDays <= 0) {
      expiringDevices.push(`- 🚨 \${row[nameIdx]} (EXPIRED)`);
    }
  });

  if (expiringDevices.length > 0) {
    const message = `<b>🏥 MediCal Daily Report</b>\\n\\nItems requiring attention:\\n\${expiringDevices.join('\\n')}`;
    sendTelegramNotification(message);
  }
}

// --- SETTINGS & RBAC ---

function getSystemSettings() {
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  const sheet = ss.getSheetByName('Settings');
  const data = sheet.getDataRange().getValues();
  let settings = {};
  data.forEach(row => {
    settings[row[0]] = row[1];
  });
  return settings;
}

function getUserRole(email) {
  const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
  const sheet = ss.getSheetByName('Users');
  const data = sheet.getDataRange().getValues();
  const user = data.find(row => row[0] === email);
  return user ? user[2] : 'User'; // Default to Read-only if not found
}

})();
</script>
</div>

</body>
</html>
